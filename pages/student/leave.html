<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>请假申请</title>
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>请假申请</h1>
      <p>提交请假申请</p>
    </div>
    
    <div class="card">
      <form id="leaveForm">
        <div class="form-group">
          <label for="leaveDate">请假日期</label>
          <input type="date" id="leaveDate" required>
        </div>
        
        <div class="form-group">
          <label for="reason">请假原因</label>
          <textarea id="reason" rows="4" placeholder="请输入请假原因" required></textarea>
        </div>
        
        <button type="submit" class="btn btn-primary">提交申请</button>
      </form>
    </div>
    
    <div class="card">
      <h2>我的请假记录</h2>
      <div id="leaveList" class="empty-state">
        <p>暂无请假记录</p>
      </div>
    </div>
    
    <div class="nav-links">
      <a href="checkin.html">返回签到</a>
      <a href="join.html">切换课程</a>
    </div>
  </div>
  
  <script type="module">
    import { getUser } from '../../js/auth.js';
    import { initSupabase, getSupabase } from '../../js/supabase.js';
    import { submitLeaveRequest } from '../../js/api.js';
    
    const user = getUser();
    if (!user) {
      window.location.href = 'login.html';
    }
    
    await initSupabase();
    
    const courseId = user.current_course_id;
    if (!courseId) {
      window.location.href = 'join.html';
    }
    
    async function loadLeaveRequests() {
      const supabase = getSupabase();
      
      const { data, error } = await supabase
        .from('leave_requests')
        .select('*')
        .eq('student_id', user.id || user.student_id)
        .eq('course_id', courseId)
        .order('created_at', { ascending: false });
      
      if (error) {
        console.error('加载请假记录失败:', error);
        return;
      }
      
      const container = document.getElementById('leaveList');
      
      if (!data || data.length === 0) {
        container.innerHTML = '<p>暂无请假记录</p>';
        return;
      }
      
      container.innerHTML = data.map(leave => {
        let statusClass = 'status-info';
        if (leave.status === '已批准') statusClass = 'status-success';
        if (leave.status === '已拒绝') statusClass = 'status-danger';
        
        return `
          <div class="list-item">
            <div class="list-item-info">
              <h3>${leave.date}</h3>
              <p>${leave.reason}</p>
            </div>
            <span class="status-badge ${statusClass}">${leave.status}</span>
          </div>
        `;
      }).join('');
    }
    
    document.getElementById('leaveForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const date = document.getElementById('leaveDate').value;
      const reason = document.getElementById('reason').value.trim();
      
      if (!date || !reason) {
        alert('请填写完整信息');
        return;
      }
      
      try {
        await submitLeaveRequest(
          user.id || user.student_id,
          courseId,
          date,
          reason
        );
        
        alert('请假申请已提交');
        document.getElementById('leaveForm').reset();
        loadLeaveRequests();
      } catch (error) {
        alert('提交失败: ' + error.message);
      }
    });
    
    loadLeaveRequests();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>教师登录</title>
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>教师登录</h1>
      <p>输入姓名和密码登录</p>
    </div>
    
    <div class="card">
      <form id="loginForm">
        <div class="form-group">
          <label for="teacherName">教师姓名</label>
          <input type="text" id="teacherName" placeholder="请输入姓名" required>
        </div>
        
        <div class="form-group">
          <label for="password">密码</label>
          <input type="password" id="password" placeholder="请输入密码" required>
        </div>
        
        <button type="submit" class="btn btn-primary">登录</button>
      </form>
    </div>
    
    <div class="nav-links">
      <a href="../../index.html">返回首页</a>
    </div>
  </div>
  
  <script type="module">
    import { setUser } from '../../js/auth.js';
    import { teacherLogin } from '../../js/api.js';
    
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const name = document.getElementById('teacherName').value.trim();
      const password = document.getElementById('password').value;
      
      if (!name || !password) {
        alert('请填写完整信息');
        return;
      }
      
      try {
        const data = await teacherLogin(name, password);
        setUser({ role: 'teacher', id: data.id, name: data.name });
        window.location.href = 'courses.html';
      } catch (error) {
        alert(error.message);
      }
    });
  </script>
</body>
</html>

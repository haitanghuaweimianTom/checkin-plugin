<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>系统管理</title>
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>系统管理</h1>
      <p>管理教师和学生账号</p>
    </div>
    
    <div class="card">
      <h2>添加教师</h2>
      <form id="addTeacherForm">
        <div class="form-group">
          <label for="teacherName">姓名</label>
          <input type="text" id="teacherName" placeholder="教师姓名" required>
        </div>
        <div class="form-group">
          <label for="teacherPwd">密码</label>
          <input type="password" id="teacherPwd" placeholder="登录密码" required>
        </div>
        <button type="submit" class="btn btn-primary">添加教师</button>
      </form>
    </div>
    
    <div class="card">
      <h2>教师列表</h2>
      <div id="teacherList" class="empty-state"><p>加载中...</p></div>
    </div>
    
    <div class="card">
      <h2>学生列表</h2>
      <div id="studentList" class="empty-state"><p>加载中...</p></div>
    </div>
    
    <div class="card">
      <h2>课程列表</h2>
      <div id="courseList" class="empty-state"><p>加载中...</p></div>
    </div>
    
    <div class="nav-links">
      <a href="courses.html">返回课程</a>
    </div>
  </div>
  
  <script type="module">
    import { getUser } from '../../js/auth.js';
    import { listTeachers, createTeacher, deleteTeacher, getAllStudents, deleteStudent, getAllCourses, deleteCourse } from '../../js/api.js';
    
    const user = getUser();
    if (!user || user.role !== 'teacher') {
      window.location.href = 'login.html';
      return;
    }
    
    async function loadTeachers() {
      try {
        const teachers = await listTeachers();
        const container = document.getElementById('teacherList');
        if (teachers.length === 0) { container.innerHTML = '<p>暂无教师</p>'; return; }
        container.innerHTML = teachers.map(t => `
          <div class="list-item">
            <div class="list-item-info">
              <h3>${t.name}</h3>
              <p>创建时间: ${new Date(t.created_at).toLocaleString('zh-CN')}</p>
            </div>
            <button class="btn btn-danger btn-sm" onclick="removeTeacher('${t.id}')">删除</button>
          </div>
        `).join('');
      } catch (error) { console.error(error); }
    }
    
    async function loadStudents() {
      try {
        const students = await getAllStudents();
        const container = document.getElementById('studentList');
        if (students.length === 0) { container.innerHTML = '<p>暂无学生</p>'; return; }
        container.innerHTML = students.map(s => `
          <div class="list-item">
            <div class="list-item-info">
              <h3>${s.name}</h3>
              <p>学号: ${s.student_id}</p>
            </div>
            <button class="btn btn-danger btn-sm" onclick="removeStudent('${s.student_id}', '${s.course_id}')">删除</button>
          </div>
        `).join('');
      } catch (error) { console.error(error); }
    }
    
    async function loadCourses() {
      try {
        const courses = await getAllCourses();
        const container = document.getElementById('courseList');
        if (courses.length === 0) { container.innerHTML = '<p>暂无课程</p>'; return; }
        container.innerHTML = courses.map(c => `
          <div class="list-item">
            <div class="list-item-info">
              <h3>${c.name}</h3>
              <p>教师: ${c.teacher_name} · 课程码: ${c.code}</p>
            </div>
            <button class="btn btn-danger btn-sm" onclick="removeCourse('${c.id}')">删除</button>
          </div>
        `).join('');
      } catch (error) { console.error(error); }
    }
    
    window.removeTeacher = async (id) => {
      if (!confirm('确定删除该教师？')) return;
      await deleteTeacher(id);
      loadTeachers();
    };
    
    window.removeStudent = async (studentId, courseId) => {
      if (!confirm('确定删除该学生？')) return;
      await deleteStudent(studentId, courseId);
      loadStudents();
    };
    
    window.removeCourse = async (id) => {
      if (!confirm('确定删除该课程？相关数据将一并删除。')) return;
      await deleteCourse(id);
      loadCourses();
    };
    
    document.getElementById('addTeacherForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('teacherName').value.trim();
      const password = document.getElementById('teacherPwd').value;
      if (!name || !password) { alert('请填写完整信息'); return; }
      
      try {
        await createTeacher(name, password);
        alert('教师添加成功！');
        document.getElementById('addTeacherForm').reset();
        loadTeachers();
      } catch (error) {
        alert('添加失败: ' + error.message);
      }
    });
    
    loadTeachers();
    loadStudents();
    loadCourses();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>签到监控</title>
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>签到监控</h1>
      <p id="courseInfo">实时签到情况</p>
    </div>
    
    <div class="card">
      <div class="stats-grid">
        <div class="stat-item">
          <div class="number" id="studentCount">0</div>
          <div class="label">总人数</div>
        </div>
        <div class="stat-item">
          <div class="number" id="checkedInCount">0</div>
          <div class="label">已签到</div>
        </div>
      </div>
      <div class="stats-grid">
        <div class="stat-item">
          <div class="number" id="notCheckedInCount">0</div>
          <div class="label">未签到</div>
        </div>
        <div class="stat-item">
          <div class="number" id="checkInRate">0%</div>
          <div class="label">签到率</div>
        </div>
      </div>
    </div>
    
    <div class="card">
      <h2>已签到</h2>
      <div id="checkInList" class="empty-state"><p>暂无记录</p></div>
    </div>
    
    <div class="card">
      <h2>未签到</h2>
      <div id="notCheckedInList" class="empty-state"><p>暂无学生</p></div>
    </div>
    
    <div class="nav-links">
      <a href="courses.html">返回课程</a>
    </div>
  </div>
  
  <script type="module">
    import { getUser } from '../../js/auth.js';
    import { getCourseStudents, getCourseCheckIns } from '../../js/api.js';
    
    const user = getUser();
    if (!user || user.role !== 'teacher') {
      window.location.href = 'login.html';
      return;
    }
    
    const urlParams = new URLSearchParams(window.location.search);
    const courseId = urlParams.get('courseId');
    if (!courseId) { window.location.href = 'courses.html'; return; }
    
    let students = [];
    let checkIns = [];
    
    async function loadData() {
      try {
        students = await getCourseStudents(courseId);
        checkIns = await getCourseCheckIns(courseId);
        
        const today = new Date().toISOString().split('T')[0];
        const todayCheckIns = checkIns.filter(c => c.created_at && c.created_at.startsWith(today));
        
        document.getElementById('studentCount').textContent = students.length;
        document.getElementById('checkedInCount').textContent = todayCheckIns.length;
        document.getElementById('notCheckedInCount').textContent = students.length - todayCheckIns.length;
        document.getElementById('checkInRate').textContent = students.length > 0 
          ? Math.round((todayCheckIns.length / students.length) * 100) + '%' : '0%';
        
        const checkInContainer = document.getElementById('checkInList');
        if (todayCheckIns.length === 0) {
          checkInContainer.innerHTML = '<p>今日暂无签到</p>';
        } else {
          checkInContainer.innerHTML = todayCheckIns.map(c => `
            <div class="list-item">
              <div class="list-item-info">
                <h3>${c.students?.name || '未知'}</h3>
                <p>${c.students?.student_id || ''} · ${new Date(c.created_at).toLocaleTimeString('zh-CN')} · 距离${c.distance}米</p>
              </div>
              <span class="status-badge status-success">${c.status}</span>
            </div>
          `).join('');
        }
        
        const notCheckInContainer = document.getElementById('notCheckedInList');
        const checkedIds = todayCheckIns.map(c => c.student_id);
        const notChecked = students.filter(s => !checkedIds.includes(s.student_id));
        
        if (notChecked.length === 0) {
          notCheckInContainer.innerHTML = '<p>全部已签到</p>';
        } else {
          notCheckInContainer.innerHTML = notChecked.map(s => `
            <div class="list-item">
              <div class="list-item-info">
                <h3>${s.name}</h3>
                <p>${s.student_id}</p>
              </div>
              <span class="status-badge status-warning">未签到</span>
            </div>
          `).join('');
        }
      } catch (error) {
        console.error('加载数据失败:', error);
      }
    }
    
    loadData();
    setInterval(loadData, 5000);
  </script>
</body>
</html>

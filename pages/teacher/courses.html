<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>课程管理</title>
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>课程管理</h1>
      <p id="teacherInfo"></p>
    </div>
    
    <div class="card">
      <h2>创建新课程</h2>
      <form id="createCourseForm">
        <div class="form-group">
          <label for="courseName">课程名称</label>
          <input type="text" id="courseName" placeholder="例如：计算机网络" required>
        </div>
        
        <div class="form-group">
          <label for="classroomName">教室位置</label>
          <input type="text" id="classroomName" disabled>
        </div>
        
        <button type="submit" class="btn btn-primary">创建课程</button>
      </form>
    </div>
    
    <div class="card">
      <h2>我的课程</h2>
      <div id="courseList" class="empty-state">
        <p>暂无课程</p>
      </div>
    </div>
    
    <div class="nav-links">
      <a href="leave.html">请假审批</a>
      <a href="admin.html">系统管理</a>
      <a href="#" id="logoutBtn">退出登录</a>
    </div>
  </div>
  
  <script type="module">
    import { getUser, clearUser } from '../../js/auth.js';
    import { createCourse, getTeacherCourses } from '../../js/api.js';
    import { CLASSROOM_LOCATION } from '../../js/config.js';
    
    const user = getUser();
    if (!user || user.role !== 'teacher') {
      window.location.href = 'login.html';
      return;
    }
    
    document.getElementById('teacherInfo').textContent = `欢迎, ${user.name}`;
    document.getElementById('classroomName').value = `(${CLASSROOM_LOCATION.lat}, ${CLASSROOM_LOCATION.lng})`;
    
    async function loadCourses() {
      try {
        const courses = await getTeacherCourses(user.id);
        const container = document.getElementById('courseList');
        
        if (courses.length === 0) {
          container.innerHTML = '<p>暂无课程</p>';
          return;
        }
        
        container.innerHTML = courses.map(course => `
          <div class="list-item">
            <div class="list-item-info">
              <h3>${course.name}</h3>
              <p>课程码: <strong>${course.code}</strong></p>
            </div>
            <div style="display: flex; gap: 8px;">
              <button class="btn btn-primary btn-sm" onclick="viewMonitor('${course.id}')">监控</button>
              <button class="btn btn-success btn-sm" onclick="exportData('${course.id}')">导出</button>
            </div>
          </div>
        `).join('');
      } catch (error) {
        console.error('加载课程失败:', error);
      }
    }
    
    window.viewMonitor = (courseId) => {
      window.location.href = `monitor.html?courseId=${courseId}`;
    };
    
    window.exportData = (courseId) => {
      window.location.href = `export.html?courseId=${courseId}`;
    };
    
    document.getElementById('createCourseForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const name = document.getElementById('courseName').value.trim();
      if (!name) {
        alert('请输入课程名称');
        return;
      }
      
      try {
        const course = await createCourse(name, user.id, user.name, CLASSROOM_LOCATION.lat, CLASSROOM_LOCATION.lng);
        alert(`课程创建成功！课程码: ${course.code}`);
        document.getElementById('courseName').value = '';
        loadCourses();
      } catch (error) {
        alert('创建失败: ' + error.message);
      }
    });
    
    document.getElementById('logoutBtn').addEventListener('click', (e) => {
      e.preventDefault();
      clearUser();
      window.location.href = 'login.html';
    });
    
    loadCourses();
  </script>
</body>
</html>
